; Appended to the vercel-php runtime's php.ini at process start.
; Defence in depth for CVE-2026-109618 / CVE-2026-109619 (PHP2Shell).
; The site's forms post small JSON bodies and never upload files.
session.upload_progress.enabled=0
post_max_size=1M
upload_max_filesize=1M
file_uploads=Off
expose_php=Off
